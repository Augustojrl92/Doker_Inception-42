# ==========================================================
# docker-compose.yml - Orquestacion de servicios
# Proyecto Inception - 42
#
# OBJETIVO:
#   1) Definir los servicios del proyecto
#   2) Conectar los contenedores por una red Docker privada
#   3) Declarar la persistencia obligatoria en /home/<login>/data
#   4) Montar secrets para las credenciales sensibles
#   5) Exponer solo los puertos necesarios al host
# ==========================================================

services:
  # ----------------------------------------------------------
  # 1) MariaDB
  # Base de datos del proyecto.
  # Guarda sus datos en /var/lib/mysql mediante mariadb_data.
  # ----------------------------------------------------------
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

  # ----------------------------------------------------------
  # 2) WordPress (PHP-FPM)
  # Ejecuta la logica PHP de WordPress.
  # Usa el volumen wordpress_data y se conecta a MariaDB/Redis.
  # ----------------------------------------------------------
  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MYSQL_HOST=mariadb
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb
      - redis

  # ----------------------------------------------------------
  # 3) NGINX
  # Unico entrypoint publico del mandatory.
  # Expone HTTPS por 443 y sirve el contenido de WordPress.
  # ----------------------------------------------------------
  nginx:
    build: ./requirements/nginx
    container_name: nginx
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - wordpress

  # ----------------------------------------------------------
  # 4) Adminer
  # Interfaz web bonus para consultar y administrar MariaDB.
  # ----------------------------------------------------------
  adminer:
    build: ./requirements/adminer
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - inception
    depends_on:
      - mariadb

  # ----------------------------------------------------------
  # 5) Redis
  # Servicio bonus de cache para WordPress.
  # Solo se usa dentro de la red interna de Docker.
  # ----------------------------------------------------------
  redis:
    build: ./requirements/redis
    container_name: redis
    restart: unless-stopped
    networks:
      - inception

  # ----------------------------------------------------------
  # 6) FTP
  # Servicio bonus para acceder al volumen de WordPress.
  # Usa el mismo almacenamiento compartido en /srv/ftp.
  # ----------------------------------------------------------
  ftp:
    build: ./requirements/ftp
    container_name: ftp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - FTP_USER=${FTP_USER}
    secrets:
      - ftp_password
    ports:
      - "2121:21"
      - "21000-21010:21000-21010"
    volumes:
      - wordpress_data:/srv/ftp
    networks:
      - inception
    depends_on:
      - wordpress

  # ----------------------------------------------------------
  # 7) Static Site
  # Sitio estatico bonus separado del WordPress principal.
  # ----------------------------------------------------------
  static_site:
    build: ./requirements/static_site
    container_name: static_site
    restart: unless-stopped
    ports:
      - "8082:8080"
    networks:
      - inception

  # ----------------------------------------------------------
  # 8) Portainer
  # Servicio bonus para administracion visual de Docker.
  # ----------------------------------------------------------
  portainer:
    build: ./requirements/portainer
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - portainer_data:/data
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    secrets:
      - portainer_admin_password
    networks:
      - inception

# ----------------------------------------------------------
# 9) Red del proyecto
# Todos los servicios se comunican aqui por nombre.
# No se usa network_mode: host.
# ----------------------------------------------------------
networks:
  inception:
    driver: bridge

# ----------------------------------------------------------
# 10) Volumenes
# Los dos volumenes obligatorios se respaldan en:
#   - /home/aurodrig/data/mariadb
#   - /home/aurodrig/data/wordpress
# ----------------------------------------------------------
volumes:
  mariadb_data:
    name: mariadb_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aurodrig/data/mariadb
  wordpress_data:
    name: wordpress_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aurodrig/data/wordpress
  portainer_data:
    name: portainer_data

# ----------------------------------------------------------
# 11) Secrets
# Credenciales sensibles montadas dentro de /run/secrets.
# ----------------------------------------------------------
secrets:
  db_root_password:
    file: ./secrets/db_root_password
  db_password:
    file: ./secrets/db_password
  ftp_password:
    file: ./secrets/ftp_password
  portainer_admin_password:
    file: ./secrets/portainer_admin_password
  wp_admin_password:
    file: ./secrets/wp_admin_password
  wp_user_password:
    file: ./secrets/wp_user_password
