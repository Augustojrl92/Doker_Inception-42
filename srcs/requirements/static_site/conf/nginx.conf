# ==========================================================
# nginx.conf - Static Site (Bonus Inception 42)
# ==========================================================
#
# QUE HACE ESTE ARCHIVO
# ---------------------
# Define una configuracion minima de NGINX para servir un sitio estatico.
# No hay PHP, no hay proxy a otro servicio y no hay FastCGI.
#
# OBJETIVO
# --------
# - Escuchar en puerto interno 8080.
# - Servir archivos desde /var/www/static.
# - Responder 404 si el recurso solicitado no existe.
# ==========================================================

# Numero de workers de NGINX (auto segun CPU disponible).
worker_processes auto;

# Bloque de eventos: limite de conexiones por worker.
events {
    worker_connections 1024;
}

# Bloque HTTP principal.
http {
    # Mapeo de tipos MIME (html/css/js/png, etc.).
    include /etc/nginx/mime.types;
    # Tipo por defecto si extension desconocida.
    default_type application/octet-stream;
    # Optimiza envio de archivos estaticos.
    sendfile on;
    # Timeout keep-alive en segundos.
    keepalive_timeout 65;

    # Virtual host del servicio estatico.
    server {
        # Puerto interno de escucha de este contenedor.
        listen 8080;
        # `_` = wildcard para cualquier host header.
        server_name _;

        # Directorio raiz de archivos estaticos.
        root /var/www/static;
        # Archivo indice por defecto.
        index index.html;

        # Entrega archivo/directorio si existe; si no, 404 explicito.
        location / {
            try_files $uri $uri/ =404;
        }
    }
}

# ==========================================================
# CONCLUSION (ESTUDIO RAPIDO)
# ==========================================================
#
# - Este NGINX esta dedicado 100% a estatico: simple y facil de defender.
# - Si no carga la pagina, revisar:
#   1) que exista /var/www/static/index.html
#   2) que el puerto publicado apunte a 8080 interno
#   3) logs de NGINX del contenedor static_site
# ==========================================================
