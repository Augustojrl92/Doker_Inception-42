# =====================================
# nginx.conf - NGINX TLS para Inception
# =====================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # ---------------------------------
    # Servidor HTTPS
    # ---------------------------------
    server {
        listen 443 ssl;
        server_name aurodrig.42.fr;

        # Certificado autofirmado generado en setup.sh
        ssl_certificate     /etc/nginx/ssl/inception.crt;
        ssl_certificate_key /etc/nginx/ssl/inception.key;

        # TLS permitido por el subject
        ssl_protocols TLSv1.2 TLSv1.3;

        # Raíz de WordPress (volumen compartido con wordpress)
        root /var/www/html;
        index index.php index.html;

        # Servir archivos estáticos, si no existen -> index.php
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        # PHP -> WordPress (PHP-FPM) por FastCGI
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass wordpress:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
}
