# ==========================================================
# nginx.conf - Configuracion principal NGINX (Inception 42)
# ==========================================================
#
# QUE DEFINE ESTE ARCHIVO
# -----------------------
# Este fichero controla el comportamiento completo de NGINX:
# - proceso maestro y workers
# - bloque `http`
# - servidor HTTPS (443)
# - enrutado de peticiones PHP hacia WordPress (php-fpm)
#
# PAPEL EN LA ARQUITECTURA
# ------------------------
# NGINX es la "puerta de entrada" del stack:
# - cliente <-> NGINX por HTTPS
# - NGINX <-> wordpress:9000 por FastCGI (red interna Docker)
#
# REGLAS CLAVE PARA INCEPTION
# ---------------------------
# - HTTPS activo (TLSv1.2/TLSv1.3)
# - sin exponer HTTP obligatorio del sitio principal
# - WordPress ya instalado (no pantalla de instalacion)
# ==========================================================

# Usuario del sistema con el que ejecutan workers de NGINX.
# `www-data` es el usuario estandar en Debian para servicios web.
user www-data;

# Numero de procesos worker.
# `auto` adapta el numero a los cores CPU disponibles.
worker_processes auto;

# Fichero donde NGINX guarda el PID del proceso maestro.
pid /run/nginx.pid;

# Bloque de eventos:
# controla como workers aceptan conexiones de red.
events {
    # Maximo de conexiones simultaneas por worker.
    # Capacidad teorica total = workers * worker_connections.
    worker_connections 1024;
}

# Bloque principal HTTP:
# aqui vive la configuracion de peticiones web y virtual hosts.
http {
    # Mapeo extensiones -> MIME types (html, css, js, png, etc.).
    include       /etc/nginx/mime.types;
    # Tipo por defecto si no se reconoce extension.
    default_type  application/octet-stream;

    # Optimiza envio de archivos estaticos usando syscall sendfile.
    sendfile on;
    # Tiempo de vida de conexiones keep-alive en segundos.
    keepalive_timeout 65;

    # ---------------------------------
    # Servidor HTTPS
    # ---------------------------------
    server {
        # NGINX escucha en 443 con SSL/TLS habilitado.
        listen 443 ssl;
        # Dominio esperado por tu proyecto/evaluacion.
        server_name aurodrig.42.fr;

        # Certificado autofirmado generado en setup.sh
        # Ruta del certificado publico.
        ssl_certificate     /etc/nginx/ssl/inception.crt;
        # Ruta de la clave privada asociada al certificado.
        ssl_certificate_key /etc/nginx/ssl/inception.key;

        # TLS permitido por el subject
        # Fuerza protocolos modernos y aceptados en evaluacion.
        ssl_protocols TLSv1.2 TLSv1.3;

        # Raíz de WordPress (volumen compartido con wordpress)
        # Directorio base de ficheros servidos por NGINX.
        root /var/www/html;
        # Orden de archivos indice por defecto.
        index index.php index.html;

        # Servir archivos estáticos, si no existen -> index.php
        location / {
            # Intenta:
            # 1) archivo exacto
            # 2) directorio
            # 3) fallback a index.php (front-controller de WordPress)
            try_files $uri $uri/ /index.php?$args;
        }

        # PHP -> WordPress (PHP-FPM) por FastCGI
        location ~ \.php$ {
            # Variables FastCGI por defecto (QUERY_STRING, REQUEST_METHOD, etc.).
            include fastcgi_params;
            # Upstream PHP-FPM: nombre DNS del servicio docker + puerto.
            fastcgi_pass wordpress:9000;
            # Archivo indice para rutas PHP.
            fastcgi_index index.php;
            # Ruta real del script PHP dentro del contenedor.
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
}

# ==========================================================
# CONCLUSION (ESTUDIO RAPIDO)
# ==========================================================
#
# - Este archivo implementa el patron clasico WordPress + php-fpm:
#   NGINX atiende web y delega PHP por FastCGI.
# - Si algo falla en evaluacion:
#   1) revisar rutas de cert/key
#   2) comprobar que wordpress:9000 responde
#   3) validar que `root` apunta al volumen correcto
#   4) revisar `try_files` y `SCRIPT_FILENAME`
# ==========================================================
