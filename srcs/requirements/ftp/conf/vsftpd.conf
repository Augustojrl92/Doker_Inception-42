# ==========================================================
# vsftpd.conf.template - Config FTP para Inception Bonus
# ==========================================================
#
# QUE HACE ESTE ARCHIVO
# ---------------------
# Es una plantilla de configuracion de vsftpd.
# `setup.sh` copia este archivo a /etc/vsftpd.conf y reemplaza:
# - __FTP_ROOT__
# - __FTP_PASV_ADDRESS__
#
# OBJETIVO
# --------
# - Permitir login de usuario local FTP.
# - Permitir escritura en carpeta de trabajo.
# - Habilitar modo pasivo compatible con Docker.
# ==========================================================

# Ejecuta vsftpd en modo escucha IPv4 standalone.
listen=YES
# Desactiva modo IPv6 para evitar doble bind/conflictos.
listen_ipv6=NO

# No permitir acceso anonimo (seguridad basica).
anonymous_enable=NO
# Permite login de usuarios locales del sistema.
local_enable=YES
# Permite comandos de escritura (upload, rename, delete segun permisos).
write_enable=YES

# Enjaula usuarios locales dentro de su raiz (chroot).
chroot_local_user=YES
# Permite escritura aunque raiz chroot sea escribible.
allow_writeable_chroot=YES

# Directorio raiz del usuario FTP (rellenado por setup.sh).
local_root=__FTP_ROOT__
# Token de usuario (util en ciertas expansiones de ruta).
user_sub_token=$USER

# Habilita modo pasivo (recomendado/normal en Docker y NAT).
pasv_enable=YES
# Rango minimo de puertos pasivos para conexiones de datos.
pasv_min_port=21000
# Rango maximo de puertos pasivos.
pasv_max_port=21010
# No resolver DNS para pasv_address (usar valor literal).
pasv_addr_resolve=NO
# IP anunciada al cliente para modo pasivo (rellenada por setup.sh).
pasv_address=__FTP_PASV_ADDRESS__

# Desactiva seccomp sandbox por compatibilidad en algunos entornos Docker.
seccomp_sandbox=NO
# Servicio PAM usado para autenticacion local.
pam_service_name=vsftpd

# Activa log de transferencias.
xferlog_enable=YES
# Activa log detallado de comandos/protocolo FTP.
log_ftp_protocol=YES

# ==========================================================
# CONCLUSION (ESTUDIO RAPIDO)
# ==========================================================
#
# - Este archivo esta orientado a FTP autenticado y modo pasivo.
# - Si LIST/UPLOAD falla pero login funciona, revisar PASV y puertos.
# - Si login falla, revisar usuario/password creados por setup.sh.
# ==========================================================
